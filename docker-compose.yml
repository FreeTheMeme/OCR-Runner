
version: '3.3'
services:
  ollama:
    image: ollama/ollama:latest
    ports:
      - "48564:11434"
    volumes:
      - ollama_data:/root/.ollama
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:11434/api/tags || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 3
volumes:
  ollama_data:
